sentence=Board abstraction for the Waveshare ESP32-S3-Touch-LCD-7 and -7B, detected at runtime: shared mutex-protected I2C bus, I/O expander, and on the -7B backlight PWM and battery ADC.
paragraph=Owns the board's shared I2C bus (a thread-safe Wire wrapper so multiple FreeRTOS tasks and drivers can share it) and its I/O expander: a CH422G on the -7, Waveshare's IO-extension microcontroller on the -7B, told apart by a read-only probe before anything is written. Exposes device-specific control for the lines wired to the expander -- panel reset and supply, backlight enable and PWM brightness, GT911 touch reset, microSD chip select and the USB/CAN switch -- plus (-7B) the battery voltage reading, and generic exioWrite()/exioRead() for the spare pins. The display library depends on this. Self-contained: no external dependencies.
category=Device Control
