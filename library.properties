sentence=Board abstraction for the Waveshare ESP32-S3-Touch-LCD-7: shared mutex-protected I2C bus and CH422G I/O expander.
paragraph=Owns the board's shared I2C bus (a thread-safe Wire wrapper so multiple FreeRTOS tasks and drivers can share it) and its CH422G I/O expander. Exposes device-specific control methods for the lines wired to the expander -- ST7262 display reset, LCD backlight enable, and GT911 touch reset -- plus a generic exioWrite() escape hatch for the unused expander pins. The display and touch libraries depend on this and drive their hardware through a board instance. Self-contained: no external dependencies.
category=Device Control
